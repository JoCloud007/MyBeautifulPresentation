services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mybp
      POSTGRES_USER: mybp
      POSTGRES_PASSWORD: mybp
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    networks:
      - mybp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mybp -d mybp"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${COMPOSE_HTTP_PROXY:-}
        HTTPS_PROXY: ${COMPOSE_HTTPS_PROXY:-}
        NO_PROXY: ${COMPOSE_NO_PROXY:-}
        NODE_TLS_REJECT_UNAUTHORIZED: ${COMPOSE_NODE_TLS_REJECT_UNAUTHORIZED:-1}
        APK_NO_CHECK_CERTIFICATE: ${APK_NO_CHECK_CERTIFICATE:-}
        NEXT_PUBLIC_MCP_PPTX_URL: http://localhost:${MCP_PPTX_PORT:-3050}
        NEXT_PUBLIC_MCP_MERMAID_URL: http://localhost:${MCP_MERMAID_PORT:-3051}
        NEXT_PUBLIC_MCP_EXCALIDRAW_URL: http://localhost:${MCP_EXCALIDRAW_PORT:-3052}
        NEXT_PUBLIC_MCP_WEB_URL: http://localhost:${MCP_WEB_PORT:-3053}
    ports:
      - "5182:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_APP_URL=http://localhost:5182
      - NEXT_PUBLIC_MCP_PPTX_URL=http://localhost:${MCP_PPTX_PORT:-3050}
      - NEXT_PUBLIC_MCP_MERMAID_URL=http://localhost:${MCP_MERMAID_PORT:-3051}
      - NEXT_PUBLIC_MCP_EXCALIDRAW_URL=http://localhost:${MCP_EXCALIDRAW_PORT:-3052}
      - NEXT_PUBLIC_MCP_WEB_URL=http://localhost:${MCP_WEB_PORT:-3053}
      - MCP_PPTX_URL=http://mcp-pptx:${MCP_PPTX_PORT:-3050}
      - MCP_MERMAID_URL=http://mcp-mermaid:${MCP_MERMAID_PORT:-3051}
      - MCP_EXCALIDRAW_URL=http://mcp-excalidraw:${MCP_EXCALIDRAW_PORT:-3052}
      - MCP_WEB_URL=http://mcp-web:${MCP_WEB_PORT:-3053}
      - OLLAMA_URL=http://ollama:${OLLAMA_PORT:-11434}
      - DATABASE_URL=postgresql://mybp:mybp@db:5432/mybp
      - HTTP_PROXY=${COMPOSE_HTTP_PROXY:-}
      - HTTPS_PROXY=${COMPOSE_HTTPS_PROXY:-}
      - NO_PROXY=${COMPOSE_NO_PROXY:-}
      - NODE_TLS_REJECT_UNAUTHORIZED=${COMPOSE_NODE_TLS_REJECT_UNAUTHORIZED:-1}
      # SSRF guard escape hatch — STRICTLY OPT-IN (default false). When true,
      # the app may proxy to private-network addresses (e.g. Ollama running
      # directly on the Docker host instead of inside the compose network).
      # Only enable this on a trusted, single-user machine: it weakens the
      # unauthenticated /api/llm proxy's SSRF protection.
      - LLM_ALLOW_PRIVATE_IPS=${LLM_ALLOW_PRIVATE_IPS:-false}
    networks:
      - mybp-network

  mcp-pptx:
    build:
      context: ./mcp/pptx-server
      dockerfile: Dockerfile
    ports:
      - "${MCP_PPTX_PORT:-3050}:${MCP_PPTX_PORT:-3050}"
    environment:
      - PORT=${MCP_PPTX_PORT:-3050}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT || 3050) + '/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - mybp-network

  mcp-mermaid:
    build:
      context: ./mcp/mermaid-server
      dockerfile: Dockerfile
    ports:
      - "${MCP_MERMAID_PORT:-3051}:${MCP_MERMAID_PORT:-3051}"
    environment:
      - PORT=${MCP_MERMAID_PORT:-3051}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT || 3051) + '/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - mybp-network

  mcp-excalidraw:
    build:
      context: ./mcp/excalidraw-server
      dockerfile: Dockerfile
    ports:
      - "${MCP_EXCALIDRAW_PORT:-3052}:${MCP_EXCALIDRAW_PORT:-3052}"
    environment:
      - PORT=${MCP_EXCALIDRAW_PORT:-3052}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT || 3052) + '/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - mybp-network

  mcp-web:
    build:
      context: ./mcp/web-server
      dockerfile: Dockerfile
    ports:
      - "${MCP_WEB_PORT:-3053}:${MCP_WEB_PORT:-3053}"
    environment:
      - PORT=${MCP_WEB_PORT:-3053}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT || 3053) + '/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - mybp-network

volumes:
  pgdata:

networks:
  mybp-network:
    driver: bridge
